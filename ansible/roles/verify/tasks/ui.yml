---
# Playwright CLI UI verification test — runs on localhost through the verification tunnel.

- name: Verify Web UI with Playwright CLI
  delegate_to: localhost
  ansible.builtin.shell: |
    set -e
    playwright-cli open http://127.0.0.1:{{ verify_local_port }}/
    playwright-cli snapshot
    playwright-cli close
  register: playwright_result
  changed_when: false
  failed_when: false

- name: Report Playwright verification status
  ansible.builtin.debug:
    msg: "Playwright UI verification completed: {{ 'passed' if playwright_result.rc == 0 else 'skipped/failed' }}"
